  <path d="M397 330 C383 389 336 428 278 434" fill="none" stroke="#13BDEB" stroke-width="2" stroke-linecap="round" opacity=".52"/>
  <g fill="#11D9ED" opacity=".9"><path d="M177 126 l7 -21 8 -4 -7 21z"/><path d="M194 119 l7 -21 8 -4 -7 21z"/><path d="M211 113 l7 -21 8 -4 -7 21z"/><path d="M370 403 l7 -21 8 -4 -7 21z" opacity=".88"/><path d="M387 397 l7 -21 8 -4 -7 21z" opacity=".72"/><path d="M404 390 l7 -21 8 -4 -7 21z" opacity=".58"/></g>
  <path d="M104 310 C143 214 271 153 382 169 C414 174 434 190 431 211 C429 229 411 245 390 260" fill="none" stroke="url(#orbitBack)" stroke-width="3.2" stroke-linecap="round" opacity=".95"/>
