<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">OmniKit app icon</title>
  <desc id="desc">A white K monogram inside a cyan-to-blue orbit ring, surrounded by a luminous orbital sweep and a mint sparkle on a deep navy rounded square.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06152F"/><stop offset=".58" stop-color="#071B3C"/><stop offset="1" stop-color="#073B83"/></linearGradient>
    <radialGradient id="bgGlow" cx="77%" cy="82%" r="70%"><stop offset="0" stop-color="#0759B8" stop-opacity=".34"/><stop offset="1" stop-color="#0759B8" stop-opacity="0"/></radialGradient>
    <linearGradient id="ring" x1=".08" y1=".08" x2=".92" y2=".92"><stop offset="0" stop-color="#49F2D7"/><stop offset=".42" stop-color="#11CFF0"/><stop offset="1" stop-color="#2876FF"/></linearGradient>
    <linearGradient id="ringHighlight" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A7FFF0" stop-opacity=".95"/><stop offset=".42" stop-color="#2CE9F1" stop-opacity=".22"/><stop offset="1" stop-color="#3B8CFF" stop-opacity="0"/></linearGradient>
    <linearGradient id="orbitFront" x1=".05" y1=".5" x2=".95" y2=".5"><stop offset="0" stop-color="#45F7E0"/><stop offset=".35" stop-color="#21DDF1"/><stop offset=".72" stop-color="#159FEF"/><stop offset="1" stop-color="#2578FF" stop-opacity=".08"/></linearGradient>
    <linearGradient id="orbitBack" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#13D9F2" stop-opacity="0"/><stop offset=".45" stop-color="#10B8F4" stop-opacity=".82"/><stop offset="1" stop-color="#2A78FF" stop-opacity=".12"/></linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#BFFFF2"/><stop offset=".48" stop-color="#66FFE2"/><stop offset="1" stop-color="#21D9E8"/></linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="tightGlow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bg)"/><rect width="512" height="512" rx="120" fill="url(#bgGlow)"/>
