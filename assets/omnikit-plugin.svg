  <path d="M148 180 A133 133 0 0 1 278 133" fill="none" stroke="url(#ringHighlight)" stroke-width="3" stroke-linecap="round" opacity=".9"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="31" stroke-linecap="round" stroke-linejoin="round"><path d="M256 177 V355"/><path d="M256 266 L359 174"/><path d="M256 266 L357 361"/></g>
  <path d="M103 309 C67 345 72 374 111 387 C166 406 264 376 340 335" fill="none" stroke="#18DFF0" stroke-width="11" stroke-linecap="round" opacity=".42" filter="url(#softGlow)"/><path d="M103 309 C67 345 72 374 111 387 C166 406 264 376 340 335" fill="none" stroke="url(#orbitFront)" stroke-width="4.2" stroke-linecap="round" filter="url(#tightGlow)"/><path d="M93 334 C83 357 98 373 128 380 C167 390 225 378 267 365" fill="none" stroke="#A5FFF0" stroke-width="1.4" stroke-linecap="round" opacity=".82"/>
